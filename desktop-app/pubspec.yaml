name: supernova_desktop
description: Native Flutter desktop client for the Supernova music server.
publish_to: "none"
version: 2026.9.21+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
