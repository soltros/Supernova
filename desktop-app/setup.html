<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Supernova Setup</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background gradients */
    .bg-gradients {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      animation: float 20s infinite ease-in-out alternate;
    }

    .glow-orb.primary {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(129,140,248,0.3) 0%, rgba(99,102,241,0) 70%);
      animation-delay: 0s;
    }

    .glow-orb.secondary {
      bottom: -20%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(167,139,250,0.2) 0%, rgba(139,92,246,0) 70%);
      animation-delay: -10s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.1); }
    }

    .setup-container {
      position: relative;
      z-index: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.2);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #6366f1;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="bg-gradients">
    <div class="glow-orb primary"></div>
    <div class="glow-orb secondary"></div>
  </div>

  <div class="setup-container">
    <h1>Supernova</h1>
    <p>Enter the URL of your Supernova instance to get started.</p>
    
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="http://ubuntu-server:5174" autocomplete="off" spellcheck="false" autofocus>
      <button id="connectBtn">Connect to Server</button>
    </div>
  </div>

  <script>
    document.getElementById('connectBtn').addEventListener('click', () => {
      const url = document.getElementById('urlInput').value.trim();
      if (url && window.supernovaDesktop) {
        window.supernovaDesktop.saveInstance(url);
      }
    });

    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('connectBtn').click();
      }
    });
  </script>
</body>
</html>
