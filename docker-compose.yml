
services:
  backend:
    image: ghcr.io/soltros/supernova-backend:main
    container_name: supernova-backend
    ports:
      - "8080:8080"
    volumes:
      # Use a Docker managed named volume for database persistence
      - supernova-data:/root/.supernova 
      # Mount the user's custom music directory into the container at the exact same path
      - ${MEDIA_PATH:-./music}:${MEDIA_PATH:-/root/Music}:ro 
    environment:
      # Pass the custom MEDIA_PATH into the Go backend
      - MEDIA_PATH=${MEDIA_PATH:-/root/Music}
      - DB_PATH=/root/.supernova/supernova.db
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
    restart: unless-stopped

  frontend:
    image: ghcr.io/soltros/supernova-frontend:main
    container_name: supernova-frontend
    ports:
      - "5174:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  supernova-data:
