
services:
  backend:
    image: ghcr.io/soltros/supernova-backend:latest
    container_name: supernova-backend
    ports:
      - "8080:8080"
    volumes:
      # Use a Docker managed named volume for database persistence
      - supernova-data:/root/.supernova 
      # Mount a local 'music' directory securely (Read-Only)
      - ${MEDIA_PATH:-./music}:/root/Music:ro 
    environment:
      - MEDIA_PATH=/root/Music
      - DB_PATH=/root/.supernova/supernova.db
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
    restart: unless-stopped

  frontend:
    image: ghcr.io/soltros/supernova-frontend:latest
    container_name: supernova-frontend
    ports:
      - "5174:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  supernova-data:
