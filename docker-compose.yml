
services:
  backend:
    image: ghcr.io/soltros/supernova-backend:main
    container_name: supernova-backend
    ports:
      - "8080:8080"
    volumes:
      # Separate the database and the cache into two different Docker volumes
      - supernova-db:/root/.supernova/db
      - supernova-cache:/root/.supernova/art_cache
      # Mount the user's custom music directory into the container at the exact same path
      - ${MEDIA_PATH:-./music}:${MEDIA_PATH:-/root/Music}:ro 
    environment:
      # Pass the custom MEDIA_PATH into the Go backend
      - MEDIA_PATH=${MEDIA_PATH:-/root/Music}
      - DB_PATH=/root/.supernova/db/supernova.db
      - ART_CACHE_PATH=/root/.supernova/art_cache
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
      # Required: set a strong random secret >= 32 chars, e.g. openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ghcr.io/soltros/supernova-frontend:main
    container_name: supernova-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  supernova-db:
  supernova-cache:
