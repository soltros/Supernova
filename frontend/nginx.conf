server {
    listen 80;

    # Use Docker's internal DNS resolver. The 'valid=10s' forces nginx to re-resolve
    # the upstream periodically rather than caching a stale/failed lookup forever.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Serve static React files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Go backend container
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy audio stream requests (larger buffer for streaming)
    location /rest/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
