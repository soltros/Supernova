name: Regression tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./... && go vet ./...
        working-directory: backend
      - run: go test ./... && go vet ./...
        working-directory: supernova-cli
      - name: Validate manual Subsonic smoke client
        run: python3 -m py_compile test_subsonic.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm test && npm run build && npm run lint
        working-directory: frontend
      - run: npm ci && npm run build
        working-directory: website

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Ensure generated Linux plugin files exist
        run: flutter create --platforms=linux --project-name supernova_desktop --org com.soltros .
        working-directory: desktop-app
      - run: flutter pub get
        working-directory: desktop-app
      - name: Show resolved Flutter lockfile
        run: cat pubspec.lock
        working-directory: desktop-app
      - run: flutter analyze
        working-directory: desktop-app
      - run: flutter test
        working-directory: desktop-app
      - run: flutter build linux --release
        working-directory: desktop-app
